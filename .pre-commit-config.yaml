repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  # black は削除 (2026-10)。CI の `ruff format --check` (line-length=120) と
  # 二重化しており、black (既定 line-length=88、[tool.black] も未定義) で整形すると
  # CI の format gate が落ちる ping-pong 状態になっていた。
  # フォーマッタは ruff に一元化する。
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, src/]
        # Phase 3 で --strict を追加し CI と同じ閾値にする
        additional_dependencies: [pydantic, sqlalchemy, fastapi]
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests
        # --cov=src を明示しないと fail-under が無条件で死蔵する (計測自体が無効のため)。
        # 閾値は CI (.github/workflows/ci.yml) と Makefile と一致させる (tests/unit 単独)。
        entry: python -m pytest tests/unit/ -q --tb=short --cov=src --cov-fail-under=70
        language: system
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]