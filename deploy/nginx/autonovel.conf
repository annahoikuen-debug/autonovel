# Nginx configuration for AutoNovel backend (SSE-friendly)

# Place this file under /etc/nginx/conf.d/autonovel.conf (or include from your server block).
# SSE 経路 (EventSource) はバッファリングせずに逐次クライアントへ転送する必要があるため、
# `proxy_buffering off` と `X-Accel-Buffering: no` を必ず設定する。

upstream autonovel_backend {
    #  application's port: Dockerfile / docker-compose.prod.yml の EXPOSE 8200 に合わせる。
    # 旧設定の 8000 はどの待ち受けポートとも一致せず、proxied request が常に 502 になっていた。
    server 127.0.0.1:8200;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 完全に upstream を再利用する（keepalive を効かせる）
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # セキュリティヘッダ
    # ブラウザ側の XSS / クリックジャッキング / MIME スヌッフィング / リファラ漏えいを低減する。
    # アプリが自前の CSP を持つ場合はそちらと重複しないよう調整すること。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 通信を HTTPS 化したうえで有効化する strict ポリシー。
    # HTTP のまま運用している間はコメントアウトするか max-age を 0 にすること。
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # バージョン情報を隠す
    server_tokens off;

    # 異常に大きいリクエストボディを拒否する
    client_max_body_size 32m;


    # 通常の API
    location / {
        proxy_pass http://autonovel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE: ストリーミング生成
    location /easy_mode/generate/stream {
        proxy_pass http://autonovel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # nginx では location ブロックの add_header が server ブロックの add_header を
        # 完全に上書きする（継承されない）。そのため SSE パスのみでも同じヘッダを
        # ここに並べ直さないと、この location だけ保護ヘッダが欠落する。
        add_header X-Accel-Buffering "no" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        chunked_transfer_encoding on;
    }

    # 既存の SSE: タスク進捗
    location /api/ {
        proxy_pass http://autonovel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
