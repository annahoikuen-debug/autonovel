name: Commercial LP - CI/CD

on:
  push:
    branches: [main, feature/commercial-lp-phase*]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: TypeScript type check
        working-directory: ./frontend
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run unit tests with coverage
        working-directory: ./frontend
        run: npm run test:ci

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      - name: Build LP
        working-directory: ./frontend
        run: npm run build
      - name: Run Lighthouse CI
        run: lhci autorun --config=.lighthouserc.json

  contract-drift:
    name: API 契約ドリフト検出
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Export OpenAPI スキーマ
        run: python scripts/export_openapi.py
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: TypeScript 型を再生成
        working-directory: ./frontend
        run: npm run generate:api-types
      - name: 差分チェック（型変更があると fail）
        run: git diff --exit-code docs/openapi.json frontend/src/types/api.generated.ts

  e2e-test:
    name: E2E Tests (Playwright)
    needs: [typecheck, lint, contract-drift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps
      - name: Build (preview サーバー用の dist を生成)
        working-directory: ./frontend
        run: npm run build
      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lighthouse, e2e-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
