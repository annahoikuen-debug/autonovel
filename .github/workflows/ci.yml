name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autonovel
          POSTGRES_PASSWORD: autonovel
          POSTGRES_DB: autonovel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autonovel -d autonovel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,rag]"

      - name: Run lint (ruff)
        run: |
          ruff check src tests config scripts

      - name: Run format check (ruff)
        run: |
          ruff format --check src tests config scripts

      - name: Run typecheck (mypy)
        run: |
          mypy src --ignore-missing-imports

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit -q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=40 --timeout=120
        env:
          DATABASE_URL: postgresql://autonovel:autonovel@localhost:5432/autonovel
          REDIS_URL: redis://localhost:6379/0
          HUEY_BACKEND: redis
          LLM_PROVIDER: mock
          AUTH_DISABLED: "true"
          AUTONOVEL_RAG_MODE: memory

      - name: Run contract tests
        run: |
          pytest tests/contract -v --tb=short --timeout=120
        env:
          DATABASE_URL: postgresql://autonovel:autonovel@localhost:5432/autonovel
          REDIS_URL: redis://localhost:6379/0
          HUEY_BACKEND: redis
          LLM_PROVIDER: mock
          AUTH_DISABLED: "true"
          AUTONOVEL_RAG_MODE: memory

      - name: Run migration check
        run: |
          alembic check
        env:
          DATABASE_URL: postgresql://autonovel:autonovel@localhost:5432/autonovel
          ALEMBIC_DATABASE_URL: postgresql://autonovel:autonovel@localhost:5432/autonovel

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint (ESLint)
        run: npm run lint

      - name: Run typecheck (tsc)
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:ci

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autonovel
          POSTGRES_PASSWORD: autonovel
          POSTGRES_DB: autonovel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autonovel -d autonovel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,rag]"

      - name: Run integration tests
        run: |
          pytest tests/integration -v --tb=short --timeout=120
        env:
          DATABASE_URL: postgresql://autonovel:autonovel@localhost:5432/autonovel
          REDIS_URL: redis://localhost:6379/0
          HUEY_BACKEND: redis
          LLM_PROVIDER: mock
          AUTH_DISABLED: "true"
          AUTONOVEL_RAG_MODE: memory

  static-analysis:
    name: Static Analysis (Ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,rag]"
          pip install pytest-timeout

      - name: Run lint ratchet (hard gate)
        run: |
          python scripts/ci_lint_ratchet.py

      - name: Run tier ratchet (hard gate)
        run: |
          python scripts/ci_tier_ratchet.py

      - name: Run marker-filtered regression tests
        run: |
          pytest -q -m "not perf and not slow and not flaky" tests/regression --tb=short --timeout=120

  release-consistency:
    name: Release Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest-timeout

      - name: Run release consistency tests
        run: |
          pytest tests/regression/test_v5_version_consistency.py tests/regression/test_tenant_fk_integrity.py tests/regression/test_H1_tautology_guard.py tests/regression/test_server_route_mount_parity.py -v --tb=short --timeout=120

  verify:
    name: Verify All Checks
    runs-on: ubuntu-latest
    needs: [test, frontend, integration, static-analysis, release-consistency]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ] || [ "${{ needs.static-analysis.result }}" != "success" ] || [ "${{ needs.release-consistency.result }}" != "success" ]; then
            echo "Some jobs failed"
            exit 1
          fi
          echo "All checks passed"