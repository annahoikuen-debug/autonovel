name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 静的解析ゲート（現状は記録のみ / ratchet）
  # ==========================================================================
  # 現状のベースライン（2026-09-27 時点）:
  #   ruff check src tests  -> 2489 errors（ただし 1705 件は W293/W292/W291 = CRLF 由来）
  #                            実質的なコード違反は 784 件
  #   mypy src             -> 1164 errors in 270 files
  # これらを一度にゲート化すると CI が恒久的に red になり、減少傾向を追う ratchet として
  # 機能しなくなるため、当面 continue-on-error: true で「記録のみ」とする。
  # エラー数は CI ログに --statistics で出力し、減少傾向を追えるようにする。
  # エラー数が 0 のルールセットが確定した時点で、そのルールだけを hard gate に格上げする。
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.5" "mypy==2.3.1"
      - name: ruff ratchet (hard gate)
        run: python scripts/ci_lint_ratchet.py
      - name: ruff (statistics for trend)
        run: ruff check src tests config scripts --statistics --output-format=concise || true
      - name: mypy (record-only for now)
        run: mypy src || true
      - name: ruff format check (record-only for now)
        run: ruff format --check src || true

  # ==========================================================================
  # リリース整合性ゲート（ continue-on-error: false = 本当の gate ）
  # ==========================================================================
  # これらのテストは外部依存（DB / LLM / ネットワーク）に一切依存しない純粋な静的検査で、
  # 現状 8 passed / 0 failed。バージョン不整合は v5 リリースの重大障害なので hard gate する。
  # 依存は pytest だけでよい: tests/conftest.py は SQLAlchemy をモジュール直下では
  # import しない（`release-consistency` ジョブが collection error になるのを防ぐため）。
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Version consistency guardrail
        run: pytest tests/regression/test_v5_version_consistency.py -q -p no:cacheprovider
      - name: CHANGELOG must document the released version
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          grep -qE "^## \[$VERSION\]" CHANGELOG.md || (echo "CHANGELOG.md に [$VERSION] のエントリがありません" && exit 1)

  # ==========================================================================
  # テストスイート
  # ==========================================================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autonovel
          POSTGRES_PASSWORD: autonovel
          POSTGRES_DB: autonovel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autonovel -d autonovel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      AUTONOVEL_RAG_MODE: memory
      RAG_FALLBACK_MODE: memory
      AUTH_DISABLED: "true"
      DATABASE_URL: postgresql+psycopg2://autonovel:autonovel@localhost:5432/autonovel_test
      REDIS_URL: redis://localhost:6379/0
      HUEY_BACKEND: redis
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout
          pip install -e ".[dev]"
      - name: Run unit test suite
        run: pytest -q -m "not integration and not perf and not slow" --timeout=120
      - name: Run v5 regression guardrails
        run: pytest tests/regression/ -v --timeout=120

  # ==========================================================================
  # フロントエンドCIゲート
  # ==========================================================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install minimal Python dependencies for snapshot check
        run: |
          python -m pip install --upgrade pip
          pip install -e .. || pip install -r ../requirements.txt || true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: planning_options スナップショットの鮮度確認
        working-directory: .
        run: python scripts/export_planning_options.py --check

