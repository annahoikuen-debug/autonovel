long_serial:
  label: 長編連載
  target_chars: 250000
  eps_range: [100, 300]
  chars_per_ep: [2000, 2500]
  arc_count: [4, 8]
  min_beats: 24
  foreshadow_scopes: [short, mid, long]
  hook_window_eps: 3
  ending_contract: 4部以上。中期伏線を有効化し、巻を跨いで持ち越す
  source: narou
series:
  label: シリーズ
  target_chars: 1000000
  eps_range: [300, 1000]
  chars_per_ep: [2000, 2500]
  arc_count: [5, 12]
  min_beats: 30
  foreshadow_scopes: [short, mid, long]
