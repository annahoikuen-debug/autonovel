[pytest]
# ここで pytest 設定を一本化する。pyproject.toml 側の [tool.pytest.ini_options] は
# 削除済み（pytest.ini が優先されるため、二つ存在すると読み手がどちらが有効か判断できない）。
pythonpath = .
testpaths = tests
norecursedirs = .git scripts node_modules storage autonovel .venv .hypothesis output artifacts
addopts =
    -p no:cacheprovider
    -p no:debugging
    --import-mode=importlib
    --tb=short
# NOTE: ハングした非同期テストを止めるタイムアウトは、既定の addopts には入れていない。
# `--timeout=120` を addopts に入れると pytest-timeout 未導入の環境では pytest 自体が
# `unrecognized arguments: --timeout=120` (exit 4) で起動できなくなるため、
# プラグイン導入を前提とした開発者のローカルループを壊してしまう。
# CI (.github/workflows/ci.yml) では requirements.txt 経由で pytest-timeout を導入済みの
# ため、各 pytest コマンドに `--timeout=120` を明示して渡している。
# pytest-timeout を導入し終えたら、ここで addopts に移してもよい。
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    perf: 実機の速度に依存する性能テスト。CI の通常実行からは除外する（`make test-perf` で実行）
    integration: 外部サービス（DB / Redis / LLM）を必要とする統合テスト。tests/integration/ には conftest が自動で付与する
    slow: 長時間実行されるテスト（通常CIでは除外）
    flaky: 一時的な失敗を許容するテスト（pytest-rerunfailures 未導入のため現状は記録のみ）
    real_llm: autouse の LLM factory モックを無効化し、実 adapters を検証するテスト（`TEST_WITH_REAL_LLM=1` でも一括で有効）
