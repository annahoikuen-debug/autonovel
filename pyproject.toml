[project]
name = "autonovel"
version = "6.0.0"
description = "AutoNovel - 小説生成エンジン (FastAPI + React + Huey + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0",
    "huey>=2.5",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.30.0",
    "redis>=5.0",
    "python-json-logger>=2.0",
    "openai>=1.20",
    "google-genai>=0.8.0",
    "protobuf>=5.29.0",
    "google-api-core>=2.25.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.4",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "aiosqlite>=0.19.0",
    "dependency-injector>=4.41.0",
    # JWT 認証 (src/backend/security/jwt.py:3 がモジュール直下で無条件に import するため必須)
    "PyJWT>=2.8.0",
    # アプリロガー (src/logging/setup.py:2 が無条件に import するため必須)
    "loguru>=0.7.2",
    # メトリクス (src/backend/observability/metrics.py, src/llm/resilient_gateway.py などが
    # モジュール直下で import するため必須。/metrics エンドポイントの前提となる)
    "prometheus-client>=0.20.0",
    # 決済 (src/backend/routers/billing_webhook.py:7 がモジュール直下で無条件に import する。
    # server.py:182 で必ず router が登録されるため、欠けると起動自体が ImportError で失敗する)
    "stripe>=11.0.0",
    # CSP ソルバ (src/narrative_balancer/csp/ の 5 モジュールがモジュール直下で
    # `from ortools.sat.python import cp_model` を import するため必須。
    # 欠けると CSP 残高 PDB 全体が ImportError になり csp-balance スクリプトが起動不能)
    "ortools>=9.10.0",
    # LLM プロバイダ SDK (src/core/llm/adapters/claude_unified_client.py:9-11 と
    # src/infrastructure/external/anthropic_client.py:13 がモジュール直下で無条件に import)
    "anthropic>=0.40.0",
    # 画像処理 (漫画組版・品質ゲート・挿絵生成が src/services/manga/*.py と
    # src/services/illustration/base.py で遅延 import する)
    "Pillow>=10.0.0",
    # 設定の永続化 (config/project_context.py:124 / config/streamlit_adapter.py:112 が
    # TOML 書き出しに使う。settings の SSOT なので欠けると UI 保存が無言で失敗する)
    "tomli_w>=1.0.0",
    # トークン圧縮のキーワード抽出 (src/services/compression/layer1_keywords.py:34 が
    # tiktoken.get_encoding("cl100k_base") を遅延 import する)
    "tiktoken>=0.7.0",
    # リソース監視 (src/backend/tasks/resource_manager.py:14 が psutil を遅延 import)
    "psutil>=5.9.0",
]

[project.scripts]
# Step 24: 統一 CLI エントリポイント
autonovel = "src.cli.main:main"
# 旧スクリプトのエイリアス（後方互換）
dsp-balance = "src.narrative_balancer.dsp.cli:main"
csp-balance = "src.narrative_balancer.csp.cli:main"
grammar-balance = "src.narrative_balancer.grammar.cli:main"
global-balance = "src.narrative_balancer.arbitrator.cli:main"


[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    # Makefile の test-perf が --benchmark-only / --benchmark-autosave を渡すため必要
    "pytest-benchmark>=4.0.0",
    # ハングした非同期テストが CI を無期限に停止させるのを防ぐ
    "pytest-timeout>=2.3.0",
    "testcontainers>=4.14.2",
    # tests/regression/test_emotional_residue_regression.py の vector_store フィクスチャが
    # RedisVectorStore へ差し込む偽 Redis クライアントに使う。
    # 未宣言のままだとクリーン環境ではこのリグレッションゲートが
    # ModuleNotFoundError で setup ERROR になり、サイレントに無効化される。
    "fakeredis>=2.21.0",
]
rag = [
    "chromadb>=1.5.0,<2.0.0",
    "rank-bm25>=0.2.2",
    "pgvector>=0.3.0",
    "sentence-transformers>=2.6.0",
]
nlp = [
    "sudachipy>=0.6.0,<0.7",
    "sudachidict-core>=20230109",
    "sudachidict-full>=20230109",
    "sudachidict-small>=20230109",
    # src/pipeline/ (character_extractor / nlp_init / polarity / signal_extractor) が
    # モジュール直下で import する。spaCy モデル本体のDL は必要だがライブラリ自体は任意。
    "spacy>=3.7.0",
]
observability = [
    # src/monitoring/sentry.py がモジュール直下で import する。
    # src/api/middleware/error_handler.py:19 側は try/except で保護済み。
    "sentry-sdk>=2.0.0",
]
load = [
    # 負荷試験 (tests/load/locustfile.py のみで使用)
    "locust>=2.32.0",
]
epub = [
    # src/easy_mode/phase3/ebook_export.py が EPUB 出力時に import する。
    # v5 の目玉機能（商用縦書き EPUB 3）なので、無条件列入を推奨。
    "ebooklib>=0.18",
]
# 重い任意依存。requirements.txt / Dockerfile には含めない (ビルド時間と
# イメージサイズが大きく増える)。GPU メモリ情報の取得が必要な環境でのみ
# 手動インストールすること。
pytorch = [
    # src/backend/tasks/resource_manager.py:19 が try/except で遅延 import し、
    # 無い場合は GPU VRAM の取得だけが None にフォールバックする
    "torch>=2.2.0",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# `src` はディレクトリ名ではなく「インポート可能なパッケージ」（`src/__init__.py` が存在する）であり、
# リポジトリ内 2453 箇所の `from src...` 絶対 import と `[project.scripts]` の
# `src.cli.main:main` はその前提で書かれている。package-dir = {"" = "src"} を指定すると
# ビルド成果物が backend / cli / models 等のトップレベル名前で flats になり、wheel install 後に
# `from src...` が全て失敗する（editable install はリポジトリルートが sys.path に入るため
# 偶然動くだけだった）。よってここではパッケージルートを明示的にリポジトリルートに固定する。
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# `src` 自体をパッケージとして配布するため、`where` はリポジトリルート（".") のまま。
# 注意: include パターンには `src` 自身を明示する必要がある。`src*` だけだと
# setuptools の packages.find に一致せず 0 パッケージになる（実測済み）。
# `config` / `prompts` / `schemas` / `formatters` は Dockerfile が実行時に必要として
# COPY しており、`src` からも `config.*` として import されるため併せて配布する。
# tests / plans / benchmarks / docs / output などの成果物ディレクトリは除外する。
where = ["."]
# `src/llm` など __init__.py を持たない名前空間パッケージ（実測で 19 ディレクトリ）
# が wheel から黙って落ちないようにする。これを付けないと find_packages は
# __init__.py の無いディレクトリを「パッケージではない」とみなして除外する。
namespaces = true
include = [
    "src", "src.*",
    "config", "config.*",
    "prompts", "prompts.*",
    "schemas", "schemas.*",
    "formatters", "formatters.*",
]
exclude = ["tests*", "benchmarks*", "plans*", "docs*", "output*", "artifacts*", "data*", "frontend*"]

# NOTE: pytest の設定は pytest.ini のみに集約している（pytest.ini が実際に読み込まれる）。
# ここに [tool.pytest.ini_options] を残すと二重管理になり、どちらが有効か読み手に混乱を招く。

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/conftest.py",
    "*/__pycache__/*",

    # =========================================================================
    # 【警告】以下のリストはテスト実行時の「カバレッジ測定除外対象」の定義です。
    # 「デッドコード」ではありません！スクリプトやツールで物理削除しないでください！
    # =========================================================================
    # パッケージマーカー（行カバレッジ対象外）
    "src/__init__.py",
    "src/*/__init__.py",
    "src/*/*/__init__.py",
    "src/*/*/*/__init__.py",

    # 非推奨スタブモジュール
    "src/services/age_client.py",
    "src/services/llm/provider_failover.py",
    "src/services/state_manager.py",
]
branch = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"*" = ["E402"]
# `__init__.py` は公開 API の再エクスポートが主目的であり、
# そこに見える未使用 import は「公開されている」ことが正当な理由。
# 削除すると `from pkg import Name` が壊れるため、T6 Step 10 で F401 を除外した。
"**/__init__.py" = ["E402", "F401"]
# `__all__` に列挙済みの import は ruff が再エクスポートと判定できない。
"**/api.py" = ["E402", "F401"]

# T6 Step 10 の残存（2026-09-29 時点、652件 → W系1646件は解消済み）:
#   F401 483 / F841 59 / F811 36 / E741 21 / F821 19 / E712 17
#   F541 9 / E701 6 / E711 1 / F403 1
# F401 を機械削除すると `models.py` の再エクスポートが壊れ、
# `src.narrative_balancer` 全体が ImportError になることを確認済み。
# よって F401 は**意図的な import** を人の目で判断する項目として残す。
# 残りは `tests/regression/test_lint_budget.py` で上限を固定し、
# 増やさないことを機械的に強制する。

