<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="AutoNovel の3つの入口: かんたん撰写 / 共創ウィザード / Studio。どれから始めても同じ作品に書き足せます">
  <title>3つの入口</title>
  <defs>
    <linearGradient id="eBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101b2e"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="500" rx="26" fill="url(#eBg)"/>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="26" fill="none" stroke="#1e293b"/>

  <text x="600" y="48" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="26" font-weight="700" fill="#f8fafc">3つの入口 ── どれから始めても、書き入れた内容はすべて同じ場所へ</text>
  <text x="600" y="76" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="14" fill="#94a3b8">あとから別の入口へ移っても、書きかけの本文や設定は失われません。</text>

  <!-- ゲート -->
  <rect x="380" y="96" width="440" height="52" rx="26" fill="#132033" stroke="#38bdf8" stroke-opacity=".55"/>
  <text x="600" y="119" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="14" font-weight="700" fill="#7dd3fc">初回アクセス：/welcome（入口を選ぶ画面）</text>
  <text x="600" y="138" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12" fill="#94a3b8">「あとで決める」を押すと かんたん執筆 へ直行します</text>

  <path d="M 600 148 L 600 166" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 210 166 L 990 166" stroke="#334155" stroke-width="2"/>
  <path d="M 210 166 L 210 190" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 600 166 L 600 190" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 990 166 L 990 190" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <!-- カード1 : かんたん執筆 -->
  <g>
    <rect x="40" y="194" width="340" height="196" rx="18" fill="#0f1a2e" stroke="#f59e0b" stroke-opacity=".7"/>
    <rect x="40" y="194" width="340" height="46" rx="18" fill="#f59e0b" fill-opacity=".16"/>
    <rect x="40" y="222" width="340" height="18" fill="#f59e0b" fill-opacity=".16"/>
    <text x="64" y="224" font-family="sans-serif" font-size="18">⚡</text>
    <text x="96" y="224" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="18" font-weight="700" fill="#fbbf24">かんたん執筆</text>
    <text x="356" y="222" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#94a3b8">/</text>

    <text x="64" y="268" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="13" fill="#e2e8f0">はじめて書きたい人</text>
    <rect x="64" y="282" width="292" height="0.8" fill="#1e293b"/>

    <text x="64" y="308" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">① ジャンルと主人公を入れる</text>
    <text x="64" y="330" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">② 本文を生成してダウンロード</text>

    <rect x="64" y="346" width="124" height="26" rx="13" fill="#1f2937" stroke="#334155"/>
    <text x="126" y="363" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="11.5" fill="#94a3b8">2手順</text>
    <rect x="196" y="346" width="124" height="26" rx="13" fill="#1f2937" stroke="#334155"/>
    <text x="258" y="363" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="11.5" fill="#94a3b8">約 1 分</text>
  </g>

  <!-- カード2 : 共創ウィザード -->
  <g>
    <rect x="430" y="194" width="340" height="196" rx="18" fill="#0f1a2e" stroke="#a78bfa" stroke-opacity=".7"/>
    <rect x="430" y="194" width="340" height="46" rx="18" fill="#a78bfa" fill-opacity=".16"/>
    <rect x="430" y="222" width="340" height="18" fill="#a78bfa" fill-opacity=".16"/>
    <text x="454" y="224" font-family="sans-serif" font-size="18">✨</text>
    <text x="486" y="224" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="18" font-weight="700" fill="#c4b5fd">共創ウィザード</text>
    <text x="746" y="222" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#94a3b8">/wizard</text>

    <text x="454" y="268" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="13" fill="#e2e8f0">物語の骨組みから作りたい人</text>
    <rect x="454" y="282" width="292" height="0.8" fill="#1e293b"/>

    <text x="454" y="308" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">Step1 方針を決める</text>
    <text x="454" y="330" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">Step2 構成を確かめる → Step3 執筆</text>

    <rect x="454" y="346" width="180" height="26" rx="13" fill="#1f2937" stroke="#334155"/>
    <text x="544" y="363" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="11.5" fill="#94a3b8">3手順 / 1話ずつ執筆</text>
  </g>

  <!-- カード3 : Studio -->
  <g>
    <rect x="820" y="194" width="340" height="196" rx="18" fill="#0f1a2e" stroke="#34d399" stroke-opacity=".7"/>
    <rect x="820" y="194" width="340" height="46" rx="18" fill="#34d399" fill-opacity=".16"/>
    <rect x="820" y="222" width="340" height="18" fill="#34d399" fill-opacity=".16"/>
    <text x="844" y="224" font-family="sans-serif" font-size="18">🚀</text>
    <text x="876" y="224" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="18" font-weight="700" fill="#6ee7b7">Studio</text>
    <text x="1136" y="222" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#94a3b8">/studio</text>

    <text x="844" y="268" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="13" fill="#e2e8f0">仕上げや設定を担う人</text>
    <rect x="844" y="282" width="292" height="0.8" fill="#1e293b"/>

    <text x="844" y="308" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">執筆：エディタ / IF分岐ルート</text>
    <text x="844" y="330" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">点検：矛盾診断 / 公開：投稿整形</text>

    <rect x="844" y="346" width="180" height="26" rx="13" fill="#1f2937" stroke="#334155"/>
    <text x="934" y="363" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="11.5" fill="#94a3b8">既存作品からすぐ</text>
  </g>

  <!-- 作品ストア -->
  <path d="M 210 392 L 210 412" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 600 392 L 600 412" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 990 392 L 990 412" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="240" y="416" width="720" height="62" rx="16" fill="#132033" stroke="#f59e0b" stroke-opacity=".5"/>
  <text x="600" y="443" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="15" font-weight="700" fill="#fcd34d">同じ作品（Book）を共有 ── 本文 / 設定集 / プロット / 伏線</text>
  <text x="600" y="466" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#94a3b8">「かんたん執筆 → Studio へ昇格」「Wizard Step3 → Studio で細部修正」のように、途中で行き来できます。</text>
</svg>
