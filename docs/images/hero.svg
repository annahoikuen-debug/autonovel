<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="AutoNovel のはたらき: 設定を入れて書いてもらい、チェックして、納品パッケージとして受け取る">
  <title>AutoNovel の全体像</title>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="380" rx="26" fill="url(#heroBg)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="26" fill="none" stroke="#1e293b"/>

  <text x="600" y="46" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="30" font-weight="700" fill="#f8fafc">あなたの設定を、小説という「納品物」にする</text>
  <text x="600" y="74" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="15" fill="#94a3b8">入力 → 執筆 → 監査 → 書き出し。ブラウザのフォームだけで完結します。</text>

  <!-- STEP 1 : 入力 -->
  <g>
    <rect x="40" y="108" width="300" height="212" rx="18" fill="#0f1a2e" stroke="#334155"/>
    <circle cx="72" cy="140" r="16" fill="#38bdf8"/>
    <text x="72" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#04263a">1</text>
    <text x="98" y="146" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">設定を入れる</text>

    <rect x="64" y="166" width="252" height="42" rx="10" fill="#132033" stroke="#38bdf8" stroke-opacity=".5"/>
    <text x="80" y="185" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12" fill="#7dd3fc">ジャンル</text>
    <text x="80" y="201" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="13" fill="#e2e8f0">異世界転生 / ダンジョン</text>

    <rect x="64" y="216" width="252" height="42" rx="10" fill="#132033" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="80" y="235" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12" fill="#c4b5fd">主人公</text>
    <text x="80" y="251" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="13" fill="#e2e8f0">アルト / 熱血 / 魔導剣術</text>

    <rect x="64" y="266" width="252" height="42" rx="10" fill="#132033" stroke="#34d399" stroke-opacity=".5"/>
    <text x="80" y="285" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12" fill="#6ee7b7">物語の種</text>
    <text x="80" y="301" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="13" fill="#e2e8f0">「封印された剣を抜く」一行</text>
  </g>

  <line x1="348" y1="214" x2="398" y2="214" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- STEP 2 : 執筆 -->
  <g>
    <rect x="410" y="96" width="380" height="236" rx="18" fill="url(#engine)" stroke="#3b82f6" stroke-opacity=".6"/>
    <circle cx="442" cy="128" r="16" fill="#fff" fill-opacity=".92"/>
    <text x="442" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">2</text>
    <text x="468" y="134" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="17" font-weight="700" fill="#ffffff">AI が執筆する</text>
    <text x="600" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#dbeafe">AutoWorkflowPipeline</text>

    <rect x="432" y="176" width="164" height="46" rx="10" fill="#0b1220" fill-opacity=".45" stroke="#93c5fd" stroke-opacity=".45"/>
    <text x="514" y="196" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#e0f2fe">二段階プロット展開</text>
    <text x="514" y="213" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#93c5fd">Coarse → Fine</text>

    <rect x="604" y="176" width="164" height="46" rx="10" fill="#0b1220" fill-opacity=".45" stroke="#93c5fd" stroke-opacity=".45"/>
    <text x="686" y="196" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#e0f2fe">投機的プリフェッチ</text>
    <text x="686" y="213" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#93c5fd">次の話を裏で展開</text>

    <rect x="432" y="230" width="164" height="46" rx="10" fill="#0b1220" fill-opacity=".45" stroke="#6ee7b7" stroke-opacity=".45"/>
    <text x="514" y="250" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#d1fae5">8人の専門監査</text>
    <text x="514" y="267" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#6ee7b7">8専門家が並列監査</text>

    <rect x="604" y="230" width="164" height="46" rx="10" fill="#0b1220" fill-opacity=".45" stroke="#fcd34d" stroke-opacity=".45"/>
    <text x="686" y="250" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#fef3c7">4層圧縮 + RAG</text>
    <text x="686" y="267" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#fcd34d">トークン削減・検索</text>

    <rect x="432" y="286" width="336" height="28" rx="14" fill="#0b1220" fill-opacity=".5"/>
    <circle cx="450" cy="300" r="4.5" fill="#4ade80"/>
    <text x="600" y="304" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="11.5" fill="#cbd5e1">本文が画面へストリーミング表示</text>
  </g>

  <line x1="798" y1="214" x2="848" y2="214" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- STEP 3 : 納品 -->
  <g>
    <rect x="860" y="108" width="300" height="212" rx="18" fill="#0f1a2e" stroke="#334155"/>
    <circle cx="892" cy="140" r="16" fill="url(#gold)"/>
    <text x="892" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#422006">3</text>
    <text x="918" y="146" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">納品物を受け取る</text>

    <rect x="884" y="164" width="252" height="30" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-opacity=".45"/>
    <text x="900" y="184" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="13" fill="#fcd34d">export_1.zip</text>
    <text x="1120" y="184" text-anchor="end" font-family="sans-serif" font-size="11" fill="#a16207">1クリック</text>

    <text x="900" y="216" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">📄 01_本文.txt</text>
    <text x="900" y="240" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">📖 02_設定集（キャラクター / 世界観）</text>
    <text x="900" y="264" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">🗂 03_プロット概要（伏線つき）</text>
    <text x="900" y="288" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#cbd5e1">🧩 04_データダンプ.json</text>

    <rect x="884" y="298" width="252" height="0.5" fill="none"/>
  </g>

  <!-- 技術スタック -->
  <g>
    <rect x="40" y="330" width="1120" height="34" rx="12" fill="#0f1a2e" stroke="#1e293b"/>
    <text x="600" y="352" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="12.5" fill="#94a3b8">FastAPI ・ React 18 / TypeScript ・ Huey Task Queue ・ SQLAlchemy 2.0 ・ PostgreSQL 16 / SQLite ・ Redis 7 ・ ChromaDB ・ Docker</text>
  </g>
</svg>
